name: Stage 7 dormant device certification

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Web/**'
      - '.github/workflows/stage7-device-certification.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=1 src/certification/stage7V2 scripts/capacitor-native-bridge.test.ts scripts/stage7V2InstalledPwa.test.ts scripts/stage7V2CertificationUiBrowser.test.ts scripts/stage7V2NativeCertificationBrowser.test.ts
      - run: npm run build:stage7-native-certification
      - run: npm run build:stage7-certification-ui

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: Web
      - run: npm run build:stage7-native-certification
        working-directory: Web
      - run: npm run native:capacitor:sync:android
        working-directory: Web
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug -PIDS_STAGE7_CERTIFICATION=true --no-daemon
        working-directory: Web/hosts/capacitor/android
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          working-directory: Web/hosts/capacitor/android
          script: ./gradlew :app:connectedDebugAndroidTest -PIDS_STAGE7_CERTIFICATION=true --no-daemon

  ios-simulator-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
        working-directory: Web
      - run: npm run native:capacitor:sync:ios
        working-directory: Web
      - run: npm run build:stage7-native-certification
        working-directory: Web
      - run: npm run native:stage7:install:ios
        working-directory: Web
        env:
          IDS_STAGE7_CERTIFICATION: 'true'
      - name: Reject stale certification resources in an ordinary build
        run: if xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build; then exit 1; fi
        working-directory: Web/hosts/capacitor/ios/App
      - run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO IDS_STAGE7_CERTIFICATION=YES PRODUCT_BUNDLE_IDENTIFIER=com.blindsidedgames.idledysonswarm.stage7certification build
        working-directory: Web/hosts/capacitor/ios/App
      - run: npm run native:stage7:restore:ios
        working-directory: Web
      - run: test ! -f hosts/capacitor/ios/App/App/public/stage7-certification.marker
        working-directory: Web
      - run: xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release CODE_SIGNING_ALLOWED=NO build
        working-directory: Web/hosts/capacitor/ios/App
