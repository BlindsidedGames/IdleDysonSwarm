name: Prepare native release candidate

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: UTC release candidate ID in YYYYMMDDNN form
        required: true
        type: string
      mode:
        description: Package only, add protected signing, or request private uploads
        required: true
        default: package-only
        type: choice
        options:
          - package-only
          - signed-packages
          - private-upload
      confirm_private_upload:
        description: Required acknowledgement for private-upload mode
        required: true
        default: false
        type: boolean
      private_upload_destination:
        description: Explicit private destination; other stores remain external gates
        required: true
        default: testflight
        type: choice
        options:
          - testflight

permissions:
  contents: read
  actions: read

concurrency:
  group: native-release-candidate-${{ inputs.release_id }}
  cancel-in-progress: false

env:
  RELEASE_ID: ${{ inputs.release_id }}
  SOURCE_SHA: ${{ github.sha }}

jobs:
  validate:
    name: Validate release request and shared runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate immutable inputs
        shell: bash
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]{10}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${{ inputs.mode }}" == "private-upload" && "${{ inputs.confirm_private_upload }}" != "true" ]]; then
            echo "::error::Private upload requires the explicit confirmation input."
            exit 1
          fi
          if [[ "${{ inputs.mode }}" == "private-upload" && "${{ inputs.private_upload_destination }}" != "testflight" ]]; then
            echo "::error::Only the explicitly reviewed TestFlight destination is implemented."
            exit 1
          fi

      - name: Install, test, lint, and build
        shell: bash
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:release:sync
          npm test -- --maxWorkers=1
          npm run lint
          npm run build:native
          npm run native:electron:check

  web-package:
    name: Package Web candidate without deployment
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build pinned Web output
        shell: bash
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:release:sync
          npm run build
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          output="output/release-candidate/web"
          mkdir -p "$output"
          tar --sort=name --mtime="@$source_date_epoch" --owner=0 --group=0 --numeric-owner \
            -czf "$output/idle-dyson-swarm-web-$RELEASE_ID.tar.gz" -C dist .
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform web \
            --security-profile unsigned \
            --output "$output" \
            --artifact "$output/idle-dyson-swarm-web-$RELEASE_ID.tar.gz"

      - name: Retain Web package briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-web
          path: output/release-candidate/web
          if-no-files-found: error
          retention-days: 1

  electron-package:
    name: Package unsigned Electron ${{ matrix.platform }} candidate
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            script: native:electron:package:windows
            extension: exe
          - platform: macos
            runner: macos-latest
            script: native:electron:package:macos
            extension: zip
          - platform: linux
            runner: ubuntu-latest
            script: native:electron:package:linux
            extension: AppImage
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build without release signing identities
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run "${{ matrix.script }}"
          output="output/release-candidate/electron-${{ matrix.platform }}"
          mkdir -p "$output"
          built=()
          while IFS= read -r artifact; do
            built+=("$artifact")
          done < <(find release/electron -maxdepth 2 -type f -name "*.${{ matrix.extension }}" | LC_ALL=C sort)
          [[ "${#built[@]}" -gt 0 ]]
          artifact_args=()
          for artifact in "${built[@]}"; do
            destination="$output/$(basename "$artifact")"
            cp "$artifact" "$destination"
            artifact_args+=(--artifact "$destination")
          done
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform "electron-${{ matrix.platform }}" \
            --security-profile unsigned \
            --output "$output" \
            "${artifact_args[@]}"

      - name: Retain Electron package briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-electron-${{ matrix.platform }}-unsigned
          path: output/release-candidate/electron-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  android-package:
    name: Package unsigned Android release candidate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the Android build JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Build explicitly unsigned release outputs
        shell: bash
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:capacitor:sync:android
          chmod +x hosts/capacitor/android/gradlew
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          ./hosts/capacitor/android/gradlew \
            -p hosts/capacitor/android \
            assembleRelease bundleRelease --no-daemon \
            -PIDS_ALLOW_UNSIGNED_RELEASE=true
          output="output/release-candidate/android"
          mkdir -p "$output"
          built=()
          while IFS= read -r artifact; do
            built+=("$artifact")
          done < <(find hosts/capacitor/android/app/build/outputs -type f \
            \( -name '*-unsigned.apk' -o -name '*.aab' \) | LC_ALL=C sort)
          [[ "${#built[@]}" -gt 0 ]]
          artifact_args=()
          for artifact in "${built[@]}"; do
            destination="$output/$(basename "$artifact")"
            cp "$artifact" "$destination"
            artifact_args+=(--artifact "$destination")
          done
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform android \
            --security-profile unsigned \
            --output "$output" \
            "${artifact_args[@]}"

      - name: Retain Android package briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-android-unsigned
          path: output/release-candidate/android
          if-no-files-found: error
          retention-days: 1

  ios-package:
    name: Package unsigned iOS simulator candidate
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build and normalize unsigned simulator archive
        shell: bash
        env:
          COPYFILE_DISABLE: '1'
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:capacitor:sync:ios
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          xcodebuild \
            -project hosts/capacitor/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find build/ios/Build/Products/Release-iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app_path" ]]
          find "$app_path" -exec touch -t 198001010000 {} +
          output="$PWD/output/release-candidate/ios-simulator"
          mkdir -p "$output"
          archive="$output/idle-dyson-swarm-ios-simulator-$RELEASE_ID.zip"
          app_parent="$(dirname "$app_path")"
          app_name="$(basename "$app_path")"
          (cd "$app_parent" && find "$app_name" -print | LC_ALL=C sort | zip -X -q "$archive" -@)
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform ios-simulator \
            --security-profile unsigned \
            --output "$output" \
            --artifact "$archive"

      - name: Retain iOS simulator package briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-ios-simulator-unsigned
          path: output/release-candidate/ios-simulator
          if-no-files-found: error
          retention-days: 1

  android-sign:
    name: Sign Android bundle behind protected environment
    if: ${{ inputs.mode == 'signed-packages' }}
    needs: [validate, android-package]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: native-release-signing
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the Android build JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android dependencies and native source without credentials
        shell: bash
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:capacitor:sync:android
          chmod +x hosts/capacitor/android/gradlew

      - name: Reconstruct and verify protected Android signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.IDS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.IDS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IDS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IDS_ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ secrets.IDS_ANDROID_KEYSTORE_CERT_SHA256 }}
        run: |
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Protected Android signing configuration is incomplete ($required)."
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/ids-upload.keystore"
          KEYSTORE_PATH="$keystore" python3 -c 'import base64,os; open(os.environ["KEYSTORE_PATH"],"wb").write(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))'
          actual="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$actual" =~ ^[0-9A-F]{64}$ ]]
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Protected Android keystore certificate fingerprint does not match the approved upload identity."
            exit 1
          fi

      - name: Build signed Android App Bundle
        shell: bash
        env:
          ORG_GRADLE_PROJECT_IDS_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ids-upload.keystore
          ORG_GRADLE_PROJECT_IDS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.IDS_ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_IDS_ANDROID_KEY_ALIAS: ${{ secrets.IDS_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_IDS_ANDROID_KEY_PASSWORD: ${{ secrets.IDS_ANDROID_KEY_PASSWORD }}
        run: |
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          ./hosts/capacitor/android/gradlew -p hosts/capacitor/android bundleRelease --no-daemon
          bundle="$(find hosts/capacitor/android/app/build/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          [[ -n "$bundle" ]]
          output="output/release-candidate/android-signed"
          mkdir -p "$output"
          destination="$output/idle-dyson-swarm-$RELEASE_ID.aab"
          cp "$bundle" "$destination"
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform android \
            --security-profile release-signed \
            --output "$output" \
            --artifact "$destination"

      - name: Retain signed Android bundle briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-android-signed
          path: output/release-candidate/android-signed
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral Android signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/ids-upload.keystore"

  ios-sign:
    name: Sign iOS archive behind protected environment
    if: ${{ inputs.mode != 'package-only' }}
    needs: [validate, ios-package]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: native-release-signing
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare iOS dependencies and native source without credentials
        shell: bash
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:capacitor:sync:ios

      - name: Require protected Apple signing inputs
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.IDS_APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IDS_APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IDS_APPLE_PROVISIONING_PROFILE_BASE64 }}
          DEVELOPMENT_TEAM: ${{ secrets.IDS_APPLE_DEVELOPMENT_TEAM }}
          PROFILE_SPECIFIER: ${{ secrets.IDS_APPLE_PROVISIONING_PROFILE_SPECIFIER }}
          EXPORT_OPTIONS: ${{ secrets.IDS_APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IDS_APPLE_KEYCHAIN_PASSWORD }}
        run: |
          for required in CERTIFICATE CERTIFICATE_PASSWORD PROFILE DEVELOPMENT_TEAM PROFILE_SPECIFIER EXPORT_OPTIONS KEYCHAIN_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Protected Apple signing configuration is incomplete ($required)."
              exit 1
            fi
          done

      - name: Install ephemeral signing identity
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.IDS_APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IDS_APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IDS_APPLE_PROVISIONING_PROFILE_BASE64 }}
          EXPORT_OPTIONS: ${{ secrets.IDS_APPLE_EXPORT_OPTIONS_PLIST_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IDS_APPLE_KEYCHAIN_PASSWORD }}
        run: |
          python3 -c 'import base64,os; open(os.environ["RUNNER_TEMP"]+"/ids-cert.p12","wb").write(base64.b64decode(os.environ["CERTIFICATE"])); open(os.environ["RUNNER_TEMP"]+"/ids.mobileprovision","wb").write(base64.b64decode(os.environ["PROFILE"])); open(os.environ["RUNNER_TEMP"]+"/ExportOptions.plist","wb").write(base64.b64decode(os.environ["EXPORT_OPTIONS"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ids-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ids-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ids-signing.keychain-db"
          security import "$RUNNER_TEMP/ids-cert.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ids-signing.keychain-db"
          security list-keychain -d user -s "$RUNNER_TEMP/ids-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ids-signing.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/ids.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/ids.mobileprovision"

      - name: Archive and export signed iOS application
        shell: bash
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IDS_APPLE_DEVELOPMENT_TEAM }}
          PROFILE_SPECIFIER: ${{ secrets.IDS_APPLE_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          archive="$RUNNER_TEMP/IdleDysonSwarm.xcarchive"
          export_path="$RUNNER_TEMP/ids-export"
          xcodebuild \
            -project hosts/capacitor/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            IDS_DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            IDS_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ipa="$(find "$export_path" -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa" ]]
          output="output/release-candidate/ios-signed"
          mkdir -p "$output"
          destination="$output/idle-dyson-swarm-$RELEASE_ID.ipa"
          cp "$ipa" "$destination"
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform ios \
            --security-profile release-signed \
            --output "$output" \
            --artifact "$destination"

      - name: Retain signed iOS package briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-ios-signed
          path: output/release-candidate/ios-signed
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral Apple signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ids-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ids-cert.p12" "$RUNNER_TEMP/ids.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/ids.mobileprovision"

  macos-sign:
    name: Sign and notarize macOS package behind protected environment
    if: ${{ inputs.mode == 'signed-packages' }}
    needs: [validate, electron-package]
    runs-on: macos-latest
    timeout-minutes: 45
    environment: native-release-signing
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare macOS dependencies and Web runtime without credentials
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run build:native

      - name: Require protected macOS signing inputs
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.IDS_MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IDS_MAC_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.IDS_APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.IDS_APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.IDS_APPLE_API_ISSUER }}
        run: |
          for required in CERTIFICATE CERTIFICATE_PASSWORD API_KEY API_KEY_ID API_ISSUER; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Protected macOS signing/notarization configuration is incomplete ($required)."
              exit 1
            fi
          done

      - name: Build signed and notarized macOS package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.IDS_MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.IDS_MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.IDS_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.IDS_APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.IDS_APPLE_API_KEY_P8_BASE64 }}
        run: |
          python3 -c 'import base64,os; open(os.environ["RUNNER_TEMP"]+"/AuthKey.p8","wb").write(base64.b64decode(os.environ["API_KEY"]))'
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          source_date_epoch="$(git show -s --format=%ct "$SOURCE_SHA")"
          export SOURCE_DATE_EPOCH="$source_date_epoch"
          npx electron-builder --config hosts/electron/electron-builder.yml --mac \
            -c.mac.hardenedRuntime=true \
            -c.mac.gatekeeperAssess=false \
            -c.mac.entitlements=hosts/electron/entitlements.mac.plist \
            -c.mac.entitlementsInherit=hosts/electron/entitlements.mac.plist \
            -c.mac.notarize=true
          package="$(find release/electron -maxdepth 2 -type f -name '*.zip' -print -quit)"
          [[ -n "$package" ]]
          output="output/release-candidate/electron-macos-signed"
          mkdir -p "$output"
          destination="$output/$(basename "$package")"
          cp "$package" "$destination"
          npx tsx scripts/create-native-release-manifest.ts \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --source-date-epoch "$source_date_epoch" \
            --platform electron-macos \
            --security-profile release-signed \
            --output "$output" \
            --artifact "$destination"
          rm -f "$APPLE_API_KEY"

      - name: Retain signed macOS package briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-electron-macos-signed
          path: output/release-candidate/electron-macos-signed
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral notarization material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  authorize-private-upload:
    name: Approve private upload boundary
    if: ${{ inputs.mode == 'private-upload' }}
    needs: [ios-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: private-release-uploads
    steps:
      - name: Reconfirm private-only authority
        shell: bash
        run: |
          [[ "${{ inputs.confirm_private_upload }}" == "true" ]]
          [[ "${{ inputs.private_upload_destination }}" == "testflight" ]]
          echo "Private upload authority accepted. Public rollout is not part of this workflow."

  testflight-upload:
    name: TestFlight protected upload
    if: ${{ inputs.mode == 'private-upload' && inputs.private_upload_destination == 'testflight' }}
    needs: [authorize-private-upload, ios-sign]
    runs-on: macos-latest
    timeout-minutes: 30
    environment: app-store-testflight
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Download exact signed iOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ids-${{ env.RELEASE_ID }}-ios-signed
          path: signed-ios

      - name: Verify exact signed iOS artifact provenance
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx tsx scripts/create-native-release-manifest.ts \
            --verify true \
            --release-id "$RELEASE_ID" \
            --source-sha "$SOURCE_SHA" \
            --platform ios \
            --security-profile release-signed \
            --output ../signed-ios \
            --artifact-extension ipa \
            --exact-artifact-count 1

      - name: Require protected App Store Connect inputs
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.IDS_APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.IDS_APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.IDS_APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
        run: |
          for required in API_KEY_ID API_ISSUER API_KEY; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Protected TestFlight configuration is incomplete ($required)."
              exit 1
            fi
          done
          xcrun -f iTMSTransporter >/dev/null

      - name: Upload only to TestFlight processing
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.IDS_APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.IDS_APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.IDS_APP_STORE_CONNECT_PRIVATE_KEY_P8_BASE64 }}
        run: |
          ipas=()
          while IFS= read -r ipa; do
            ipas+=("$ipa")
          done < <(find signed-ios -maxdepth 1 -type f -name '*.ipa' | LC_ALL=C sort)
          [[ "${#ipas[@]}" -eq 1 ]]
          ipa="${ipas[0]}"
          key_directory="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_directory"
          key_path="$key_directory/AuthKey_$API_KEY_ID.p8"
          KEY_PATH="$key_path" python3 -c 'import base64,os; open(os.environ["KEY_PATH"],"wb").write(base64.b64decode(os.environ["API_KEY"]))'
          xcrun iTMSTransporter -m upload -assetFile "$ipa" -apiKey "$API_KEY_ID" -apiIssuer "$API_ISSUER"
          rm -f "$key_path"

      - name: Remove ephemeral App Store Connect key
        if: ${{ always() }}
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.IDS_APP_STORE_CONNECT_KEY_ID }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
