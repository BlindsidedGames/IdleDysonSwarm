name: Verify Web and native foundations

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build shared runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Web/.nvmrc
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install locked dependencies
        working-directory: Web
        run: npm ci

      - name: Run deterministic tests
        working-directory: Web
        run: npm test -- --maxWorkers=1

      - name: Lint sources
        working-directory: Web
        run: npm run lint

      - name: Build the /play/ PWA
        working-directory: Web
        run: npm run build

      - name: Build native-relative assets
        working-directory: Web
        run: npm run build:native

      - name: Validate the Electron process boundary
        working-directory: Web
        run: npm run native:electron:check

  android:
    name: Assemble unsigned Android debug host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Web/.nvmrc
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Use the Android build JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and synchronize Android
        working-directory: Web
        run: |
          npm ci
          npm run native:capacitor:sync:android

      - name: Assemble the unsigned debug application
        working-directory: Web/hosts/capacitor/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: Compile unsigned iOS simulator host
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Web/.nvmrc
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install and synchronize iOS
        working-directory: Web
        run: |
          npm ci
          npm run native:capacitor:sync:ios

      - name: Compile without distribution credentials
        working-directory: Web
        run: >-
          xcodebuild
          -project hosts/capacitor/ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
