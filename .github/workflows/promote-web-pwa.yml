name: Prepare Idle Dyson Swarm website promotion

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: UTC release candidate ID in YYYYMMDDNN form
        required: true
        type: string
      website_ref:
        description: Exact 40-character BlindsidedGames website commit SHA to promote onto
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-promotion-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  website-pull-request:
    name: Build and open protected website PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: website-promotion
    env:
      RELEASE_ID: ${{ inputs.release_id }}
      WEBSITE_REF: ${{ inputs.website_ref }}
    steps:
      - name: Check out the pinned game source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use the repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: Web/.nvmrc
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Validate immutable promotion inputs
        shell: bash
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]{10}$ ]]
          [[ "$WEBSITE_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Install, verify, and build the Web release
        working-directory: Web
        run: |
          npm ci
          IDS_RELEASE_CANDIDATE_ID="$RELEASE_ID" npm run native:release:sync
          npm test
          npm run lint
          npm run build

      - name: Create checksummed promotion package
        id: package
        working-directory: Web
        shell: bash
        run: |
          npm run website:promotion:prepare -- \
            --release-id "$RELEASE_ID" \
            --source-sha "$GITHUB_SHA" \
            --website-ref "$WEBSITE_REF"
          package_path="$PWD/output/website-promotion/$RELEASE_ID-${GITHUB_SHA:0:12}"
          echo "path=$package_path" >> "$GITHUB_OUTPUT"

      - name: Retain the pinned promotion package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: idle-dyson-swarm-${{ env.RELEASE_ID }}-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Check out the exact website revision
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_PROMOTION_TOKEN }}
        shell: bash
        run: |
          gh repo clone BlindsidedGames/BlindsidedGames website
          git -C website checkout --detach "$WEBSITE_REF"
          git -C website switch -c "idle-dyson-swarm-$RELEASE_ID"

      - name: Apply only the pinned promotion package
        working-directory: Web
        run: |
          npm run website:promotion:apply -- \
            --package "${{ steps.package.outputs.path }}" \
            --website-checkout "$GITHUB_WORKSPACE/website"

      - name: Commit, push, and open the website pull request
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_PROMOTION_TOKEN }}
        shell: bash
        run: |
          git -C website config user.name "Blindsided Games Release Bot"
          git -C website config user.email "blindsidedgames@outlook.com"
          git -C website add public/play public/_headers promotions/idle-dyson-swarm
          git -C website diff --cached --quiet && {
            echo "Promotion produced no website changes."
            exit 1
          }
          git -C website commit -m "Promote Idle Dyson Swarm Web $RELEASE_ID"
          git -C website push origin "idle-dyson-swarm-$RELEASE_ID"
          gh pr create \
            --repo BlindsidedGames/BlindsidedGames \
            --base main \
            --head "idle-dyson-swarm-$RELEASE_ID" \
            --title "Promote Idle Dyson Swarm Web $RELEASE_ID" \
            --body "Pinned game source: $GITHUB_SHA
          Pinned website base: $WEBSITE_REF

          This PR is a preview candidate only. Merging and production deployment require separate authorization."
