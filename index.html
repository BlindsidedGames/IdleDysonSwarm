<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#2f1738" />
    <meta name="application-name" content="Idle Dyson Swarm" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/play/manifest.webmanifest" />
    <link rel="icon" href="/play/icons/pwa-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/play/icons/pwa-icon-192.png" />
    <link rel="stylesheet" href="/bootstrap.css" />
    <meta
      name="idle-dyson-swarm-permanent-double-ip"
      content="false"
    />
    <title>Idle Dyson Swarm</title>
  </head>
  <body>
    <div id="root">
      <main
        class="native-launch-loader"
        role="status"
        aria-live="polite"
        aria-label="Idle Dyson Swarm is starting"
      >
        <img
          class="native-launch-loader__mark"
          src="/play/icons/pwa-icon-512.png"
          alt=""
        />
        <h1 class="native-launch-loader__title">Idle Dyson Swarm</h1>
        <span class="native-launch-loader__activity" aria-hidden="true"></span>
        <p class="native-launch-loader__status">Starting your swarm…</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
